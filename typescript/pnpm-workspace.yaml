packages:
  - packages/core
  - packages/extensions
  - packages/mcp
  - packages/http/*
  - packages/mechanisms/tron
  - examples/**/*
overrides:
  "tronweb@6.5.2>axios": "1.21.0"
  "axios@1.21.0>follow-redirects": "1.16.2"
  cssstyle: 5.3.6
minimumReleaseAge: 4320 # Only install package versions that have been published for at least 3 days.
minimumReleaseAgeStrict: true
minimumReleaseAgeExclude:
  # Verified official TronWeb release with stricter transaction validation.
  - "tronweb@6.5.2"
  - "@x402/core@2.29.0"
  - "@x402/evm@2.29.0"
  - "@x402/extensions@2.29.0"
  - "@x402/express@2.29.0"
  - "@x402/fetch@2.29.0"
  - "@x402/mcp@2.29.0"
allowBuilds:
  bigint-buffer: true
  bufferutil: true
  esbuild: true
  keccak: true
  protobufjs: true
  sharp: true
  unrs-resolver: true
  utf-8-validate: true
