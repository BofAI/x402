              stripped = line.strip()

              if stripped.startswith("@charset"):
                  continue
              if stripped.startswith(":root"):
                  continue
              if css_like.match(stripped):
                  continue
              if stripped in {"{", "}", "};"}:
                  continue

              if not stripped.startswith("```"):
                  line = re.sub(r"[ \t]+", " ", line).strip()

              lines.append(line)

          cleaned = []
          blank = False
          for line in lines:
              if line.strip():
                  cleaned.append(line)
                  blank = False
              else:
                  if not blank:
                      cleaned.append("")
                  blank = True

          text = "\n".join(cleaned).strip()

          replacements = {
              "Code Review Report": "## Code Review Report",
              "PR Overview": "### PR Overview",
              "Branch Information": "### Branch Information",
              "Commit History": "### Commit History",
              "Files Changed": "- Files Changed",
              "Lines Added": "- Lines Added",
              "Lines Removed": "- Lines Removed",
              "Commits": "- Commits",
