name: Audit PR

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, ready_for_review]
  issue_comment:
    types: [created]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  audit-on-pr:
    name: Audit on pull request
    if: github.event_name == 'pull_request'
    runs-on: [self-hosted, Linux, ARM64, audit-linux]

    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Check required tools
        run: |
          which zip
          which jq
          which python3

      - name: Create source archive
        id: archive
        shell: bash
        run: |
          ARCHIVE_NAME="${{ github.event.repository.name }}.zip"
          rm -f "/tmp/${ARCHIVE_NAME}"
          zip -r "/tmp/${ARCHIVE_NAME}" .
          echo "archive_name=${ARCHIVE_NAME}" >> "$GITHUB_OUTPUT"

      - name: Submit audit job
        id: submit
        shell: bash
        run: |
          RESPONSE=$(curl -s -X POST "${{ vars.AUDIT_SERVICE_URL }}/audit-pr/${{ vars.AUDIT_PR_SKILL }}" \
            -H "X-API-Key: ${{ secrets.AUDIT_API_KEY }}" \
            -F "file=@/tmp/${{ steps.archive.outputs.archive_name }}" \
            -F "from_branch=${{ github.event.pull_request.base.ref }}" \
            -F "to_branch=${{ github.event.pull_request.head.ref }}")

          echo "Submit response:"
          echo "$RESPONSE" | jq .

          REPORT_URL=$(echo "$RESPONSE" | jq -r '.report_url // empty')
          STATUS_URL=$(echo "$RESPONSE" | jq -r '.status_url // empty')
          STATUS=$(echo "$RESPONSE" | jq -r '.status // empty')

          if [ -z "$REPORT_URL" ] && [ -z "$STATUS_URL" ]; then
            echo "Audit service did not return report_url/status_url"
            exit 1
          fi

          echo "report_url=$REPORT_URL" >> "$GITHUB_OUTPUT"
          echo "status_url=$STATUS_URL" >> "$GITHUB_OUTPUT"
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"

      - name: Poll audit status until completed
        id: poll
        shell: bash
        run: |
          STATUS_PATH="${{ steps.submit.outputs.status_url }}"
          if [ -z "$STATUS_PATH" ]; then
            echo "Missing status_url"
            exit 1
          fi

          FINAL_STATUS=""
          for i in $(seq 1 60); do
            RESP=$(curl -s "${{ vars.AUDIT_SERVICE_URL }}${STATUS_PATH}")
            echo "Poll #$i:"
            echo "$RESP" | jq .

            CURRENT_STATUS=$(echo "$RESP" | jq -r '.status // empty')
            if [ "$CURRENT_STATUS" = "completed" ]; then
              FINAL_STATUS="completed"
              break
            fi

            if [ "$CURRENT_STATUS" = "failed" ] || [ "$CURRENT_STATUS" = "error" ]; then
              echo "Audit failed with status: $CURRENT_STATUS"
              exit 1
            fi

            sleep 10
          done

          if [ "$FINAL_STATUS" != "completed" ]; then
            echo "Audit did not complete within timeout"
            exit 1
          fi

          echo "final_status=$FINAL_STATUS" >> "$GITHUB_OUTPUT"

      - name: Fetch final report html
        shell: bash
        run: |
          REPORT_PATH="${{ steps.submit.outputs.report_url }}"
          if [ -z "$REPORT_PATH" ]; then
            echo "Missing report_url"
            exit 1
          fi

          curl -s "${{ vars.AUDIT_SERVICE_URL }}${REPORT_PATH}" -o /tmp/audit-report.html

          if [ ! -s /tmp/audit-report.html ]; then
            echo "Fetched report html is empty"
            exit 1
          fi

      - name: Convert html to readable text
        shell: bash
        run: |
          python3 <<'PY'
          import re
          from html.parser import HTMLParser
          from pathlib import Path

          html = Path("/tmp/audit-report.html").read_text(encoding="utf-8", errors="ignore")

          class ReportParser(HTMLParser):
              BLOCK_TAGS = {"p", "div", "section", "article", "header", "footer", "aside", "main",
                            "table", "thead", "tbody", "tfoot", "tr", "ul", "ol"}
              HEADER_TAGS = {"h1", "h2", "h3", "h4", "h5", "h6"}
              def __init__(self):
                  super().__init__()
                  self.parts = []
                  self.in_pre = False

              def _push(self, text):
                  self.parts.append(text)

              def handle_starttag(self, tag, attrs):
                  if tag in self.HEADER_TAGS | self.BLOCK_TAGS:
                      self._push("\n")
                  if tag == "br":
                      self._push("\n")
                  if tag == "li":
                      self._push("\n- ")
                  if tag == "pre":
                      self._push("\n")
                      self.in_pre = True

              def handle_endtag(self, tag):
                  if tag in self.HEADER_TAGS | self.BLOCK_TAGS:
                      self._push("\n")
                  if tag == "pre":
                      self._push("\n")
                      self.in_pre = False

              def handle_data(self, data):
                  if not data:
                      return
                  self._push(data)

          parser = ReportParser()
          parser.feed(html)
          text = "".join(parser.parts)

          lines = []
          for line in text.splitlines():
              line = re.sub(r"[ \t]+", " ", line).strip()
              lines.append(line)

          cleaned = []
          blank = False
          for line in lines:
              if line:
                  cleaned.append(line)
                  blank = False
              else:
                  if not blank:
                      cleaned.append("")
                  blank = True

          output = "\n".join(cleaned).strip() + "\n"
          Path("/tmp/audit-report.txt").write_text(output, encoding="utf-8")
          PY

      - name: Comment final report to PR
        uses: actions/github-script@v7
        env:
          REPORT_PATH: ${{ steps.submit.outputs.report_url }}
          STATUS_PATH: ${{ steps.submit.outputs.status_url }}
          RUN_GROUP: github-pr-${{ github.run_id }}-${{ github.run_attempt }}
        with:
          script: |
            const fs = require('fs');

            const reportText = fs.readFileSync('/tmp/audit-report.txt', 'utf8').trim();
            const reportPath = process.env.REPORT_PATH || '';
            const statusPath = process.env.STATUS_PATH || '';
            const runGroup = process.env.RUN_GROUP || 'unknown';

            const prefix = [
              `[AUDIT-PR][source=pull_request][run=${runGroup}]`,
              '',
              'Status: completed',
              `Report path: ${reportPath}`,
              `Status path: ${statusPath}`,
              ''
            ].join('\n');

            const fullText = `${prefix}\n${reportText}`;
            const limit = 60000;
            const chunks = [];

            for (let i = 0; i < fullText.length; i += limit) {
              chunks.push(fullText.slice(i, i + limit));
            }

            for (let i = 0; i < chunks.length; i++) {
              const body = [
                `[AUDIT-PR][source=pull_request][run=${runGroup}][part ${i + 1}/${chunks.length}]`,
                '',
                chunks[i]
              ].join('\n');

              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                body
              });
            }

  audit-by-comment:
    name: Audit by PR comment
    if: >
      github.event_name == 'issue_comment' &&
      github.event.issue.pull_request &&
      contains(github.event.comment.body, '/audit-pr') &&
      contains(format(',{0},', vars.AUDIT_ALLOWED_USERS), format(',{0},', github.event.comment.user.login))
    runs-on: [self-hosted, Linux, ARM64, audit-linux]

    steps:
      - name: Get PR info
        id: pr
        uses: actions/github-script@v7
        with:
          script: |
            const pr = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number
            });

            core.setOutput('head_ref', pr.data.head.ref);
            core.setOutput('base_ref', pr.data.base.ref);
            core.setOutput('head_sha', pr.data.head.sha);

      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.pr.outputs.head_sha }}
          fetch-depth: 0

      - name: Check required tools
        run: |
          which zip
          which jq
          which python3

      - name: Create source archive
        id: archive
        shell: bash
        run: |
          ARCHIVE_NAME="${{ github.event.repository.name }}.zip"
          rm -f "/tmp/${ARCHIVE_NAME}"
          zip -r "/tmp/${ARCHIVE_NAME}" .
          echo "archive_name=${ARCHIVE_NAME}" >> "$GITHUB_OUTPUT"

      - name: Submit audit job
        id: submit
        shell: bash
        run: |
          RESPONSE=$(curl -s -X POST "${{ vars.AUDIT_SERVICE_URL }}/audit-pr/${{ vars.AUDIT_PR_SKILL }}" \
            -H "X-API-Key: ${{ secrets.AUDIT_API_KEY }}" \
            -F "file=@/tmp/${{ steps.archive.outputs.archive_name }}" \
            -F "from_branch=${{ steps.pr.outputs.base_ref }}" \
            -F "to_branch=${{ steps.pr.outputs.head_ref }}")

          echo "Submit response:"
          echo "$RESPONSE" | jq .

          REPORT_URL=$(echo "$RESPONSE" | jq -r '.report_url // empty')
          STATUS_URL=$(echo "$RESPONSE" | jq -r '.status_url // empty')
          STATUS=$(echo "$RESPONSE" | jq -r '.status // empty')

          if [ -z "$REPORT_URL" ] && [ -z "$STATUS_URL" ]; then
            echo "Audit service did not return report_url/status_url"
            exit 1
          fi

          echo "report_url=$REPORT_URL" >> "$GITHUB_OUTPUT"
          echo "status_url=$STATUS_URL" >> "$GITHUB_OUTPUT"
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"

      - name: Poll audit status until completed
        id: poll
        shell: bash
        run: |
          STATUS_PATH="${{ steps.submit.outputs.status_url }}"
          if [ -z "$STATUS_PATH" ]; then
            echo "Missing status_url"
            exit 1
          fi

          FINAL_STATUS=""
          for i in $(seq 1 60); do
            RESP=$(curl -s "${{ vars.AUDIT_SERVICE_URL }}${STATUS_PATH}")
            echo "Poll #$i:"
            echo "$RESP" | jq .

            CURRENT_STATUS=$(echo "$RESP" | jq -r '.status // empty')
            if [ "$CURRENT_STATUS" = "completed" ]; then
              FINAL_STATUS="completed"
              break
            fi

            if [ "$CURRENT_STATUS" = "failed" ] || [ "$CURRENT_STATUS" = "error" ]; then
              echo "Audit failed with status: $CURRENT_STATUS"
              exit 1
            fi

            sleep 10
          done

          if [ "$FINAL_STATUS" != "completed" ]; then
            echo "Audit did not complete within timeout"
            exit 1
          fi

          echo "final_status=$FINAL_STATUS" >> "$GITHUB_OUTPUT"

      - name: Fetch final report html
        shell: bash
        run: |
          REPORT_PATH="${{ steps.submit.outputs.report_url }}"
          if [ -z "$REPORT_PATH" ]; then
            echo "Missing report_url"
            exit 1
          fi

          curl -s "${{ vars.AUDIT_SERVICE_URL }}${REPORT_PATH}" -o /tmp/audit-report.html

          if [ ! -s /tmp/audit-report.html ]; then
            echo "Fetched report html is empty"
            exit 1
          fi

      - name: Convert html to readable text
        shell: bash
        run: |
          python3 <<'PY'
          import re
          from html.parser import HTMLParser
          from pathlib import Path

          html = Path("/tmp/audit-report.html").read_text(encoding="utf-8", errors="ignore")

          class ReportParser(HTMLParser):
              BLOCK_TAGS = {"p", "div", "section", "article", "header", "footer", "aside", "main",
                            "table", "thead", "tbody", "tfoot", "tr", "ul", "ol"}
              HEADER_TAGS = {"h1", "h2", "h3", "h4", "h5", "h6"}
              def __init__(self):
                  super().__init__()
                  self.parts = []
                  self.in_pre = False

              def _push(self, text):
                  self.parts.append(text)

              def handle_starttag(self, tag, attrs):
                  if tag in self.HEADER_TAGS | self.BLOCK_TAGS:
                      self._push("\n")
                  if tag == "br":
                      self._push("\n")
                  if tag == "li":
                      self._push("\n- ")
                  if tag == "pre":
                      self._push("\n")
                      self.in_pre = True

              def handle_endtag(self, tag):
                  if tag in self.HEADER_TAGS | self.BLOCK_TAGS:
                      self._push("\n")
                  if tag == "pre":
                      self._push("\n")
