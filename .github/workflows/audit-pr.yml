name: Audit PR

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, ready_for_review]
  issue_comment:
    types: [created]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: audit-pr-${{ github.event.pull_request.number || github.event.issue.number || github.ref }}
  cancel-in-progress: true

jobs:
  audit-on-pr:
    name: Audit on pull request
    if: github.event_name == 'pull_request'
    runs-on: [self-hosted, Linux, ARM64, audit-linux]

    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Check required tools
        run: |
          which zip
          which jq
          which python3
          which node
          which npm

      - name: Create source archive
        id: archive
        shell: bash
        run: |
          ARCHIVE_NAME="${{ github.event.repository.name }}.zip"
          rm -f "/tmp/${ARCHIVE_NAME}"
          zip -r "/tmp/${ARCHIVE_NAME}" .
          echo "archive_name=${ARCHIVE_NAME}" >> "$GITHUB_OUTPUT"

      - name: Submit audit job
        id: submit
        shell: bash
        run: |
          RESPONSE=$(curl -s -X POST "${{ vars.AUDIT_SERVICE_URL }}/audit-pr/${{ vars.AUDIT_PR_SKILL }}" \
            -H "X-API-Key: ${{ secrets.AUDIT_API_KEY }}" \
            -F "file=@/tmp/${{ steps.archive.outputs.archive_name }}" \
            -F "from_branch=${{ github.event.pull_request.base.ref }}" \
            -F "to_branch=${{ github.event.pull_request.head.ref }}")

          echo "Submit response:"
          echo "$RESPONSE" | jq .

          REPORT_URL=$(echo "$RESPONSE" | jq -r '.report_url // empty')
          STATUS_URL=$(echo "$RESPONSE" | jq -r '.status_url // empty')
          STATUS=$(echo "$RESPONSE" | jq -r '.status // empty')

          if [ -z "$REPORT_URL" ] && [ -z "$STATUS_URL" ]; then
            echo "Audit service did not return report_url/status_url"
            exit 1
          fi

          echo "report_url=$REPORT_URL" >> "$GITHUB_OUTPUT"
          echo "status_url=$STATUS_URL" >> "$GITHUB_OUTPUT"
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"

      - name: Poll audit status until completed
        id: poll
        shell: bash
        run: |
          STATUS_PATH="${{ steps.submit.outputs.status_url }}"
          if [ -z "$STATUS_PATH" ]; then
            echo "Missing status_url"
            exit 1
          fi

          FINAL_STATUS=""
          for i in $(seq 1 40); do
            RESP=$(curl -s "${{ vars.AUDIT_SERVICE_URL }}${STATUS_PATH}")
            echo "Poll #$i:"
            echo "$RESP" | jq .

            CURRENT_STATUS=$(echo "$RESP" | jq -r '.status // empty')
            if [ "$CURRENT_STATUS" = "completed" ]; then
              FINAL_STATUS="completed"
              break
            fi

            if [ "$CURRENT_STATUS" = "failed" ] || [ "$CURRENT_STATUS" = "error" ]; then
              echo "Audit failed with status: $CURRENT_STATUS"
              exit 1
            fi

            sleep 30
          done

          if [ "$FINAL_STATUS" != "completed" ]; then
            echo "Audit did not complete within timeout"
            exit 1
          fi

          echo "final_status=$FINAL_STATUS" >> "$GITHUB_OUTPUT"

      - name: Fetch final report html
        shell: bash
        run: |
          REPORT_PATH="${{ steps.submit.outputs.report_url }}"
          if [ -z "$REPORT_PATH" ]; then
            echo "Missing report_url"
            exit 1
          fi

          curl -s "${{ vars.AUDIT_SERVICE_URL }}${REPORT_PATH}" -o /tmp/audit-report.html

          if [ ! -s /tmp/audit-report.html ]; then
            echo "Fetched report html is empty"
            exit 1
          fi

      - name: Install Playwright
        shell: bash
        run: |
          mkdir -p /tmp/audit-render
          cd /tmp/audit-render
          if [ ! -f package.json ]; then
            npm init -y >/dev/null 2>&1
          fi
          npm install playwright >/dev/null 2>&1
          npx playwright install chromium

      - name: Render report html to long PNG
        shell: bash
        run: |
          cd /tmp/audit-render
          cat > render.js <<'EOF'
          const { chromium } = require('playwright');
          const path = require('path');

          (async () => {
            const browser = await chromium.launch({ headless: true });
            const page = await browser.newPage({
              viewport: { width: 1440, height: 1200 },
              deviceScaleFactor: 1.5
            });

            const filePath = 'file://' + path.resolve('/tmp/audit-report.html');
            await page.goto(filePath, { waitUntil: 'networkidle' });
            await page.screenshot({
              path: '/tmp/audit-report.png',
              fullPage: true
            });

            await browser.close();
          })();
          EOF
          node render.js

          if [ ! -s /tmp/audit-report.png ]; then
            echo "Failed to render PNG"
            exit 1
          fi

      - name: Upload audit artifacts
        uses: actions/upload-artifact@v4
        with:
          name: audit-pr-${{ github.event.repository.name }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            /tmp/audit-report.html
            /tmp/audit-report.png
          if-no-files-found: error
          retention-days: 7

      - name: Write summary
        run: |
          {
            echo "## Audit PR result"
            echo ""
            echo "- status: completed"
            echo "- report_path: ${{ steps.submit.outputs.report_url }}"
            echo "- status_path: ${{ steps.submit.outputs.status_url }}"
            echo "- artifact: audit-pr-${{ github.event.repository.name }}-${{ github.run_id }}-${{ github.run_attempt }}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Comment summary to PR
        uses: actions/github-script@v7
        env:
          REPORT_PATH: ${{ steps.submit.outputs.report_url }}
          STATUS_PATH: ${{ steps.submit.outputs.status_url }}
          ARTIFACT_NAME: audit-pr-${{ github.event.repository.name }}-${{ github.run_id }}-${{ github.run_attempt }}
          RUN_GROUP: github-pr-${{ github.run_id }}-${{ github.run_attempt }}
        with:
          script: |
            const reportPath = process.env.REPORT_PATH || '';
            const statusPath = process.env.STATUS_PATH || '';
            const artifactName = process.env.ARTIFACT_NAME || '';
            const runGroup = process.env.RUN_GROUP || 'unknown';

            const body = [
              `[AUDIT-PR][source=pull_request][run=${runGroup}]`,
              '',
              'Status: completed',
              `Report path: ${reportPath}`,
              `Status path: ${statusPath}`,
              `Artifact: ${artifactName}`,
              '',
              'The full audit report has been rendered as a long PNG and uploaded as a GitHub Actions artifact in this workflow run.'
            ].join('\n');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body
            });

  audit-by-comment:
    name: Audit by PR comment
    if: >
      github.event_name == 'issue_comment' &&
      github.event.issue.pull_request &&
      contains(github.event.comment.body, '/audit-pr') &&
      contains(format(',{0},', vars.AUDIT_ALLOWED_USERS), format(',{0},', github.event.comment.user.login))
    runs-on: [self-hosted, Linux, ARM64, audit-linux]

    steps:
      - name: Get PR info
        id: pr
        uses: actions/github-script@v7
        with:
          script: |
            const pr = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number
            });

            core.setOutput('head_ref', pr.data.head.ref);
            core.setOutput('base_ref', pr.data.base.ref);
            core.setOutput('head_sha', pr.data.head.sha);

      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.pr.outputs.head_sha }}
          fetch-depth: 0

      - name: Check required tools
        run: |
          which zip
          which jq
          which python3
          which node
          which npm

      - name: Create source archive
        id: archive
        shell: bash
        run: |
          ARCHIVE_NAME="${{ github.event.repository.name }}.zip"
          rm -f "/tmp/${ARCHIVE_NAME}"
          zip -r "/tmp/${ARCHIVE_NAME}" .
          echo "archive_name=${ARCHIVE_NAME}" >> "$GITHUB_OUTPUT"

      - name: Submit audit job
        id: submit
        shell: bash
        run: |
          RESPONSE=$(curl -s -X POST "${{ vars.AUDIT_SERVICE_URL }}/audit-pr/${{ vars.AUDIT_PR_SKILL }}" \
            -H "X-API-Key: ${{ secrets.AUDIT_API_KEY }}" \
            -F "file=@/tmp/${{ steps.archive.outputs.archive_name }}" \
            -F "from_branch=${{ steps.pr.outputs.base_ref }}" \
            -F "to_branch=${{ steps.pr.outputs.head_ref }}")

          echo "Submit response:"
          echo "$RESPONSE" | jq .

          REPORT_URL=$(echo "$RESPONSE" | jq -r '.report_url // empty')
          STATUS_URL=$(echo "$RESPONSE" | jq -r '.status_url // empty')
          STATUS=$(echo "$RESPONSE" | jq -r '.status // empty')

          if [ -z "$REPORT_URL" ] && [ -z "$STATUS_URL" ]; then
            echo "Audit service did not return report_url/status_url"
            exit 1
          fi

          echo "report_url=$REPORT_URL" >> "$GITHUB_OUTPUT"
          echo "status_url=$STATUS_URL" >> "$GITHUB_OUTPUT"
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"

      - name: Poll audit status until completed
        id: poll
        shell: bash
        run: |
          STATUS_PATH="${{ steps.submit.outputs.status_url }}"
          if [ -z "$STATUS_PATH" ]; then
            echo "Missing status_url"
            exit 1
          fi

          FINAL_STATUS=""
          for i in $(seq 1 40); do
            RESP=$(curl -s "${{ vars.AUDIT_SERVICE_URL }}${STATUS_PATH}")
            echo "Poll #$i:"
            echo "$RESP" | jq .

            CURRENT_STATUS=$(echo "$RESP" | jq -r '.status // empty')
            if [ "$CURRENT_STATUS" = "completed" ]; then
              FINAL_STATUS="completed"
              break
            fi

            if [ "$CURRENT_STATUS" = "failed" ] || [ "$CURRENT_STATUS" = "error" ]; then
              echo "Audit failed with status: $CURRENT_STATUS"
              exit 1
            fi

            sleep 30
          done

          if [ "$FINAL_STATUS" != "completed" ]; then
            echo "Audit did not complete within timeout"
            exit 1
          fi

          echo "final_status=$FINAL_STATUS" >> "$GITHUB_OUTPUT"

      - name: Fetch final report html
        shell: bash
        run: |
          REPORT_PATH="${{ steps.submit.outputs.report_url }}"
          if [ -z "$REPORT_PATH" ]; then
            echo "Missing report_url"
            exit 1
          fi

          curl -s "${{ vars.AUDIT_SERVICE_URL }}${REPORT_PATH}" -o /tmp/audit-report.html

          if [ ! -s /tmp/audit-report.html ]; then
            echo "Fetched report html is empty"
            exit 1
          fi

      - name: Install Playwright
        shell: bash
        run: |
          mkdir -p /tmp/audit-render
          cd /tmp/audit-render
          if [ ! -f package.json ]; then
            npm init -y >/dev/null 2>&1
          fi
          npm install playwright >/dev/null 2>&1
          npx playwright install chromium

      - name: Render report html to long PNG
        shell: bash
        run: |
          cd /tmp/audit-render
          cat > render.js <<'EOF'
          const { chromium } = require('playwright');
          const path = require('path');

          (async () => {
            const browser = await chromium.launch({ headless: true });
            const page = await browser.newPage({
              viewport: { width: 1440, height: 1200 },
              deviceScaleFactor: 1.5
            });

            const filePath = 'file://' + path.resolve('/tmp/audit-report.html');
            await page.goto(filePath, { waitUntil: 'networkidle' });
            await page.screenshot({
              path: '/tmp/audit-report.png',
              fullPage: true
            });

            await browser.close();
          })();
          EOF
          node render.js

          if [ ! -s /tmp/audit-report.png ]; then
            echo "Failed to render PNG"
            exit 1
          fi

      - name: Upload audit artifacts
        uses: actions/upload-artifact@v4
        with:
          name: audit-pr-${{ github.event.repository.name }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            /tmp/audit-report.html
            /tmp/audit-report.png
          if-no-files-found: error
          retention-days: 7

      - name: Comment summary to PR
        uses: actions/github-script@v7
        env:
          REPORT_PATH: ${{ steps.submit.outputs.report_url }}
          STATUS_PATH: ${{ steps.submit.outputs.status_url }}
          ARTIFACT_NAME: audit-pr-${{ github.event.repository.name }}-${{ github.run_id }}-${{ github.run_attempt }}
          RUN_GROUP: github-pr-comment-${{ github.run_id }}-${{ github.run_attempt }}
        with:
          script: |
            const reportPath = process.env.REPORT_PATH || '';
            const statusPath = process.env.STATUS_PATH || '';
            const artifactName = process.env.ARTIFACT_NAME || '';
            const runGroup = process.env.RUN_GROUP || 'unknown';

            const body = [
              `[AUDIT-PR][source=comment][/audit-pr][run=${runGroup}]`,
              '',
              'Status: completed',
              `Report path: ${reportPath}`,
              `Status path: ${statusPath}`,
              `Artifact: ${artifactName}`,
              '',
              'The full audit report has been rendered as a long PNG and uploaded as a GitHub Actions artifact in this workflow run.'
            ].join('\n');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });
