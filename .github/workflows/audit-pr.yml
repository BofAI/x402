              def handle_data(self, data):
                  if not data:
                      return
                  self._push(data)

          parser = ReportParser()
          parser.feed(html)
          text = "".join(parser.parts)

          lines = []
          for line in text.splitlines():
              line = re.sub(r"[ \t]+", " ", line).strip()
