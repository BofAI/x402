          summary = []
          summary.append("## Audit PR Report")
          summary.append("")
          summary.append(f"**Status:** {conclusion}")
          if project:
              summary.append(f"**Project:** {project}")
          if pr_line:
              summary.append(f"**PR:** {pr_line}")
          if review_date:
              summary.append(f"**Review Date:** {review_date}")
          if reviewer:
              summary.append(f"**Reviewer:** {reviewer}")
          summary.append(f"**Report path:** ${{{{REPORT_PATH}}}}")
          summary.append(f"**Status path:** ${{{{STATUS_PATH}}}}")
          summary.append("")
          summary.append("---")
          summary.append("")
          summary.append(text)

          final_text = "\n".join(summary)
          final_text = re.sub(r'\n{3,}', '\n\n', final_text).strip() + "\n"
          Path("/tmp/audit-report.md").write_text(final_text, encoding="utf-8")
          PY

      - name: Replace placeholders in markdown
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          p = Path("/tmp/audit-report.md")
          text = p.read_text(encoding="utf-8")
          text = text.replace("${{REPORT_PATH}}", "${{ steps.submit.outputs.report_url }}")
          text = text.replace("${{STATUS_PATH}}", "${{ steps.submit.outputs.status_url }}")
          p.write_text(text, encoding="utf-8")
          PY

      - name: Comment full report to PR
        uses: actions/github-script@v7
        env:
          RUN_GROUP: github-pr-comment-${{ github.run_id }}-${{ github.run_attempt }}
        with:
          script: |
            const fs = require('fs');
            const runGroup = process.env.RUN_GROUP || 'unknown';
            const reportText = fs.readFileSync('/tmp/audit-report.md', 'utf8').trim();

            const limit = 60000;
            const chunks = [];
            for (let i = 0; i < reportText.length; i += limit) {
              chunks.push(reportText.slice(i, i + limit));
            }

            for (let i = 0; i < chunks.length; i++) {
              const body = [
                `[AUDIT-PR][source=comment][/audit-pr][run=${runGroup}][part ${i + 1}/${chunks.length}]`,
                '',
                chunks[i]
              ].join('\n');

              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body
              });
            }
