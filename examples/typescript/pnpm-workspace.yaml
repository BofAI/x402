packages:
  - "clients/*"
  - "servers/*"
  - "facilitator/*"
  - "logging"
  # Link the in-repo SDK packages so examples build against local source.
  - "../../typescript/packages/core"
  - "../../typescript/packages/extensions"
  - "../../typescript/packages/legacy/extensions"
  - "../../typescript/packages/http/*"
  - "../../typescript/packages/mcp"
  - "../../typescript/packages/mechanisms/*"
minimumReleaseAge: 4320 # Only install package versions that have been published for at least 3 days.
minimumReleaseAgeStrict: true
allowBuilds:
  bigint-buffer: true
  bufferutil: true
  esbuild: true
  keccak: true
  protobufjs: true
  sharp: true
  unrs-resolver: true
  utf-8-validate: true

# Use one Express 4 declaration tree for our Express 4 examples and middleware.
overrides:
  "@types/express": "4.17.25"
