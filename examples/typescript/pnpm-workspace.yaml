packages:
  - "clients/*"
  - "servers/*"
  - "facilitator/*"
  - "logging"
  # Only TRON packages are local; use official npm integrations.
  - "../../typescript/packages/extensions"
  - "../../typescript/packages/mechanisms/tron"
minimumReleaseAge: 4320 # Only install package versions that have been published for at least 3 days.
minimumReleaseAgeStrict: true
# Allow the verified official Zod security release before the normal 3-day delay.
minimumReleaseAgeExclude:
  - "@x402/core@2.29.0"
  - "@x402/evm@2.29.0"
  - "@x402/extensions@2.29.0"
  - "@x402/express@2.29.0"
  - "@x402/fetch@2.29.0"
  - "@x402/mcp@2.29.0"
allowBuilds:
  bigint-buffer: true
  bufferutil: true
  esbuild: true
  keccak: true
  protobufjs: true
  sharp: true
  unrs-resolver: true
  utf-8-validate: true

# Use one Express 4 declaration tree for our Express 4 examples and middleware.
overrides:
  "@types/express": "4.17.25"
